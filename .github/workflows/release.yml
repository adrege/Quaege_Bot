name: Release merged pull request

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read

  build-linux:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build RPM
        run: ./build_linux.sh

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: Quaege_Bot-linux-rpm
          path: dist/rpm/*.rpm
          if-no-files-found: error

  create-release:
    if: github.event.pull_request.merged == true
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Quaege_Bot-windows
          path: release-assets

      - name: Download Linux RPM
        uses: actions/download-artifact@v4
        with:
          name: Quaege_Bot-linux-rpm
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_TITLE: Quaege Bot release ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$RELEASE_TITLE" \
            --generate-notes
